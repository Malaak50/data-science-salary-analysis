[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salary_prediction"
version = "0.1.0"
description = "Analyse et prédiction des salaires dans la Data Science"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Malak" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "joblib>=1.3",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]